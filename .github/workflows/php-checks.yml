name: PHP checks

# Checks are paused during rapid development. Run manually from Actions
# when we're ready to resume validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP syntax (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app bin config database public tests -type f -name '*.php' -print0)
      - name: Check Ubuntu installer shell syntax
        run: bash -n install/ubuntu-vm-install.sh
      - name: Run operation queue validation tests
        run: php tests/operation_queue_validation.php
      - name: Run domain name validation tests
        run: php tests/domain_name_validation.php
      - name: Run phpMyAdmin handoff input tests
        run: php tests/phpmyadmin_handoff_validation.php
      - name: Run provisioning contract tests
        run: php tests/provisioning_contract_validation.php
      - name: Run deterministic provisioning plan tests
        run: php tests/provisioning_plan_validation.php
      - name: Run provisioning preflight validation tests
        run: php tests/provisioning_preflight_validation.php
      - name: Run provisioning operations validation tests
        run: php tests/provisioning_operations_validation.php
      - name: Run operations service protocol validation tests
        run: php tests/operations_service_protocol_validation.php
      - name: Run operations service client validation tests
        run: php tests/operations_service_client_validation.php
      - name: Run read-only server facts validation tests
        run: php tests/read_only_server_facts_validation.php
      - name: Run website preflight CLI input tests
        shell: bash
        run: |
          if php bin/preflight-website.php invalid-id >/dev/null 2>&1; then
            echo "Invalid website ID unexpectedly accepted" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Run operation recovery validation tests
        run: php tests/operation_recovery_validation.php
